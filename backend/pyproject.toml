[project]
name = "route-optimizer-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "functions-framework>=3.0",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "genetic_algorithm", "distance_matrix"]
